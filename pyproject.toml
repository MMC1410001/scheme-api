[project]
name = "scheme-api"
version = "0.1.0"
description = "APIs that serve Scheme data (SAP files in GCS) to the client team"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "openpyxl>=3.1",
    "google-cloud-storage>=2.18",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
